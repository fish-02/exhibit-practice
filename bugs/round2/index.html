    <h1>霧中的渡口</h1>
    <p class="author">散文｜作者：沈映澄</p>
    <p>渡口的霧總在清晨最濃。賣豆漿的阿姨說，霧是河在打呵欠，等太陽出來，它就會把昨天的事情全部忘掉。我每天搭第一班船去上學，坐在同一個位置，看對岸慢慢從白色裡長出來。</p>
    <p>後來橋蓋好了，渡口只剩下假日的觀光船。有一天我特地起了大早，想再看一次那場霧，才發現真正消失的不是霧，而是那些與我一起等船的人。</p>
    <blockquote class="quote">有些路還在，只是不再有人一起走。</blockquote>
    <p class="caption">引自作者手稿，第三頁。</p>
