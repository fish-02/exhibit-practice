<body>
  <main>
    <article>
      <h1>退潮時分的郵筒</h1>
      <p>短篇小說｜作者：林予潮</p>
      <img src="images/cover.svg" alt="潮間帶抽象插圖">
      <p>外婆家門口的郵筒，每到退潮就會露出底座的鏽痕。小時候我以為那是海寫給陸地的信，只是字跡太潦草，沒有人讀得懂。</p>
      <p>外婆過世那年，我在郵筒裡發現一張沒有郵戳的明信片。收件人是我，寄件人的欄位空著，只畫了一條歪歪斜斜的海岸線。</p>
      <blockquote>
        潮水退去以後<br>
        所有未寄出的話<br>
        都留在沙上
      </blockquote>
    </article>
  </main>
  <footer>
    <p>本頁為教學用虛構內容，作者與作品皆為虛構。</p>
  </footer>
