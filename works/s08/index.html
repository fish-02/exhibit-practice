  午夜渡輪

  極短篇｜作者：何予舟

  （圖片請放這裡，檔案是 images/cover.svg）

  最後一班渡輪在午夜開出，船上只有我和售票員。他問我要去哪裡，我說對岸。他笑了笑：「每個人都這樣說。」

  船開了很久，對岸的燈始終沒有變大。我低頭看手上的票，上面印著的不是地名，而是一個我已經忘記的日期。

  回程的票
  總是比去程
  更難買到
