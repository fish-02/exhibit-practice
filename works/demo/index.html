  退潮時分的郵筒

  短篇小說｜作者：林予潮

  （圖片請放這裡，檔案是 images/cover.svg）

  外婆家門口的郵筒，每到退潮就會露出底座的鏽痕。小時候我以為那是海寫給陸地的信，只是字跡太潦草，沒有人讀得懂。

  外婆過世那年，我在郵筒裡發現一張沒有郵戳的明信片。收件人是我，寄件人的欄位空著，只畫了一條歪歪斜斜的海岸線。

  潮水退去以後
  所有未寄出的話
  都留在沙上
