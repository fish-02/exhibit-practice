  燈塔看守人的日記

  短篇小說｜作者：吳映岸

  （圖片請放這裡，檔案是 images/cover.svg）

  三月十二日，霧。今天沒有船經過，我仍然把燈點亮。上一任看守人留下的規矩只有一條：不要問光要照給誰看。

  三月十三日，晴。遠方出現一艘小船，朝我打了三次信號。翻遍手冊，都查不到那代表什麼。我回了三次，假裝我們說的是同一種語言。

  光不必被看見
  才算抵達
  它只需要出發
