  島嶼方言中的海洋詞彙

  論文摘要｜作者：蔡沐澄

  （圖片請放這裡，檔案是 images/cover.svg）

  本文以虛構島嶼「澄嶼」的口述資料為例，整理漁民日常使用的海洋詞彙，並分析詞彙如何反映當地人對潮汐的時間感。

  研究發現，當地以潮位而非鐘點安排作息，相關詞彙也多與身體動作連結。語言因此不只是描述環境的工具，也是記錄生活節奏的檔案。
