  鹽的重量

  散文｜作者：陳潮音

  （圖片請放這裡，檔案是 images/cover.svg）

  父親的工作服總是硬的。汗乾了又濕，濕了又乾，衣領上結出一圈白色的邊，像地圖上的海岸。

  我長大後才知道，鹽並不重。真正讓那件衣服站得起來的，是他從來不肯說出口的那些日子。

  一件衣服
  替沉默的人
  記住了海
