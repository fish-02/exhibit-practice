<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>潮間帶｜潮間帶虛構展</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article>
      <h1>潮間帶</h1>
      <p>現代詩｜作者：黃以汀</p>
      <img src="images/cover.svg" alt="潮間帶抽象插圖">
      <p>這首詩寫於一次清晨的海岸散步。作者把潮間帶看成語言的邊界，在淹沒與露出之間，尋找詞語的生存方式。</p>
      <p>全詩不用標點，讓每一行的斷句像浪一樣停留，再把呼吸交還給讀者。</p>
      <blockquote>
        我們是被海反覆朗讀的<br>
        一行短句<br>
        讀到一半就退去
      </blockquote>
    </article>
  </main>
  <footer>
    <p>本頁為教學用虛構內容，作者與作品皆為虛構。</p>
  </footer>
</body>
</html>
