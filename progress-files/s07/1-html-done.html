      <h1>貝殼收藏學</h1>
      <p>散文｜作者：許書沫</p>
      <img src="images/cover.svg" alt="潮間帶抽象插圖">
      <p>我收藏貝殼的方法，是只撿破掉的。完整的貝殼太像答案，破掉的才留下問題：它遇過哪一塊礁石，又被哪一次浪帶到這裡？</p>
      <p>朋友笑我的櫃子像事故現場。我說這是圖書館，每一道裂痕都是作者親筆寫下的註解。</p>
      <blockquote>
        缺口不是遺失<br>
        是海留下的<br>
        閱讀記號
      </blockquote>
    </article>
