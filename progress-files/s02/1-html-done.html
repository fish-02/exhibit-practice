  <main>
    <article>
      <h1>鹽的重量</h1>
      <p>散文｜作者：陳潮音</p>
      <img src="images/cover.svg" alt="潮間帶抽象插圖">
      <p>父親的工作服總是硬的。汗乾了又濕，濕了又乾，衣領上結出一圈白色的邊，像地圖上的海岸。</p>
      <p>我長大後才知道，鹽並不重。真正讓那件衣服站得起來的，是他從來不肯說出口的那些日子。</p>
      <blockquote>
        一件衣服<br>
        替沉默的人<br>
        記住了海
      </blockquote>
    </article>
  </main>
  <footer>
    <p>本頁為教學用虛構內容，作者與作品皆為虛構。</p>
  </footer>
