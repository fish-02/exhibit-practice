      <h1>島嶼方言中的海洋詞彙</h1>
      <p>論文摘要｜作者：蔡沐澄</p>
      <img src="images/cover.svg" alt="潮間帶抽象插圖">
      <p>本文以虛構島嶼「澄嶼」的口述資料為例，整理漁民日常使用的海洋詞彙，並分析詞彙如何反映當地人對潮汐的時間感。</p>
      <p>研究發現，當地以潮位而非鐘點安排作息，相關詞彙也多與身體動作連結。語言因此不只是描述環境的工具，也是記錄生活節奏的檔案。</p>
      <blockquote>
        詞彙的消失<br>
        往往早於<br>
        生活方式的消失
      </blockquote>
    </article>
  </main>
