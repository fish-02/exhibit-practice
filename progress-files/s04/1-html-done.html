      <h1>燈塔看守人的日記</h1>
      <p>短篇小說｜作者：吳映岸</p>
      <img src="images/cover.svg" alt="潮間帶抽象插圖">
      <p>三月十二日，霧。今天沒有船經過，我仍然把燈點亮。上一任看守人留下的規矩只有一條：不要問光要照給誰看。</p>
      <p>三月十三日，晴。遠方出現一艘小船，朝我打了三次信號。翻遍手冊，都查不到那代表什麼。我回了三次，假裝我們說的是同一種語言。</p>
      <blockquote>
        光不必被看見<br>
        才算抵達<br>
        它只需要出發
      </blockquote>
    </article>
  </main>
  <footer>
    <p>本頁為教學用虛構內容，作者與作品皆為虛構。</p>
