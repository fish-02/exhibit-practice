<body>
  <main>
    <article>
      <h1>午夜渡輪</h1>
      <p>極短篇｜作者：何予舟</p>
      <img src="images/cover.svg" alt="潮間帶抽象插圖">
      <p>最後一班渡輪在午夜開出，船上只有我和售票員。他問我要去哪裡，我說對岸。他笑了笑：「每個人都這樣說。」</p>
      <p>船開了很久，對岸的燈始終沒有變大。我低頭看手上的票，上面印著的不是地名，而是一個我已經忘記的日期。</p>
      <blockquote>
        回程的票<br>
        總是比去程<br>
        更難買到
      </blockquote>
    </article>
  </main>
  <footer>
    <p>本頁為教學用虛構內容，作者與作品皆為虛構。</p>
  </footer>
