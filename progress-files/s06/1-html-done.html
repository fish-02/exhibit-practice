  <main>
    <article>
      <h1>讀海：一堂國文課</h1>
      <p>教案｜作者：鄭浩汐</p>
      <img src="images/cover.svg" alt="潮間帶抽象插圖">
      <p>本教案適合國中七年級，共兩節課。學生先閱讀一篇描寫海岸的短文，圈出能引發聽覺、嗅覺與觸覺的詞語，再分組討論它們帶來的感受。</p>
      <p>第二節課請學生回想一處熟悉的地方，只用感官描寫完成一百字短文，不寫地名，再請同學猜猜看這是哪裡。</p>
      <blockquote>
        先學會看見<br>
        才能寫下<br>
        別人看不見的地方
      </blockquote>
    </article>
  </main>
  <footer>
    <p>本頁為教學用虛構內容，作者與作品皆為虛構。</p>
  </footer>
